spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/coupon?useSSL=false&allowPublicKeyRetrieval=true
    username: coupon
    password: coupon
    hikari:
      # 고정 크기 풀(minimum-idle = maximum-pool-size)로 워밍업 편차 제거
      maximum-pool-size: ${HIKARI_POOL_SIZE:20}
      minimum-idle: ${HIKARI_POOL_SIZE:20}
      connection-timeout: 30000
      auto-commit: false
server:
  port: 8080
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
    accept-count: 1000
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
coupon:
  optimistic:
    max-retries: ${OPTIMISTIC_MAX_RETRIES:20}
logging:
  level:
    root: WARN
    com.seongmin.coupon: INFO
